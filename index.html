<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeeo Software Market — Official Vektor Zero Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header / Navbar -->
  <nav class="border-b border-gray-800 bg-gray-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-500/20">
          <i class="fa-solid fa-code text-xl"></i>
        </div>
        <div>
          <span class="text-xl font-black tracking-wider text-white">ZEEO<span class="text-blue-500"> MARKET</span></span>
          <span class="block text-[10px] text-gray-400 tracking-widest font-mono uppercase">Vektor Zero Ecosystem</span>
        </div>
      </div>
      <div class="text-xs text-gray-400 flex items-center gap-2 bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-full">
        <i class="fa-solid fa-shield-halved text-emerald-400"></i>
        <span>Official Verified Store</span>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-12 w-full">
    <!-- Hero Banner -->
    <div class="mb-12 text-center max-w-2xl mx-auto">
      <div class="inline-block bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs px-3 py-1 rounded-full font-semibold mb-3">
        ⚡ PAY-PER-DOWNLOAD SYSTEM
      </div>
      <h1 class="text-3xl md:text-5xl font-black mb-4 tracking-tight">Zeeo Software Market</h1>
      <p class="text-gray-400 text-sm md:text-base">Katalog resmi software & aplikasi karya Zeeo. Sekali bayar, dapatkan akses penuh selamanya.</p>
    </div>

    <!-- Product Grid (Daftar Aplikasi Otomatis Muncul di Sini) -->
    <div id="app-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Card aplikasi akan di-generate otomatis oleh JavaScript -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-800/80 bg-gray-900/30 py-8 text-center">
    <p class="text-xs text-gray-500">© 2026 Zeeo Software Market. Powered by <span class="text-gray-300 font-semibold">Vektor Zero</span>.</p>
  </footer>

  <script>
    // =========================================================================
    // DAFTAR APLIKASI ANDA (Tambahkan / Edit Aplikasi Anda di Sini)
    // =========================================================================
    const daftarAplikasi = [
      {
        id: "app-1",
        nama: "Zeeo POS Kasir Pro",
        versi: "v1.2.0 • Windows",
        harga: 50000,
        deskripsi: "Aplikasi kasir dan manajemen stok barang lengkap tanpa biaya langganan bulanan.",
        linkDownload: "https://drive.google.com/file/d/LINK_GOOGLE_DRIVE_1/view"
      },
      {
        id: "app-2",
        nama: "Vektor Auto Whatsapp",
        versi: "v2.0.1 • Windows",
        harga: 75000,
        deskripsi: "Tool pengirim pesan promosi otomatis untuk kebutuhan marketing & bisnis.",
        linkDownload: "https://drive.google.com/file/d/LINK_GOOGLE_DRIVE_2/view"
      },
      {
        id: "app-3",
        nama: "Zeeo File Encryption Tool",
        versi: "v1.0.0 • Android / APK",
        harga: 35000,
        deskripsi: "Aplikasi pengaman dan pembuat enkripsi file rahasia dengan standar Vektor Zero.",
        linkDownload: "https://drive.google.com/file/d/LINK_GOOGLE_DRIVE_3/view"
      }
    ];

    // =========================================================================
    // FUNGSI UNTUK MENAMPILKAN SEMUA APLIKASI SECARA OTOMATIS
    // =========================================================================
    function tampilkanKatalog() {
      const container = document.getElementById('app-container');
      container.innerHTML = '';

      daftarAplikasi.forEach(app => {
        const hargaFormatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(app.harga);
        
        const cardHTML = `
          <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-6 shadow-xl hover:border-blue-500/40 transition-all flex flex-col justify-between">
            <div>
              <div class="flex items-start justify-between gap-3 mb-4">
                <div>
                  <h3 class="text-lg font-bold text-white">${app.nama}</h3>
                  <span class="text-xs bg-blue-500/10 text-blue-400 px-2.5 py-0.5 rounded-full font-medium inline-block mt-1">${app.versi}</span>
                </div>
                <div class="text-right">
                  <div class="text-lg font-extrabold text-emerald-400">${hargaFormatted}</div>
                </div>
              </div>
              <p class="text-gray-400 text-sm mb-6">${app.deskripsi}</p>
            </div>

            <div class="pt-4 border-t border-gray-800/80 flex items-center justify-between">
              <span class="text-xs text-gray-500 font-mono">Dev: Vektor Zero</span>
              <button onclick="prosesPembayaran('${app.nama}', ${app.harga}, '${app.linkDownload}')" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs md:text-sm px-4 py-2.5 rounded-xl shadow-lg shadow-blue-600/20 transition active:scale-95">
                Beli & Download
              </button>
            </div>
          </div>
        `;
        container.innerHTML += cardHTML;
      });
    }

    // Fungsi Pembayaran & Unduh
    function prosesPembayaran(namaApp, harga, linkDownload) {
      alert("Proses Pembayaran untuk: " + namaApp + "\nHarga: Rp " + harga.toLocaleString('id-ID'));
      let konfirmasi = confirm("Simulasi Pembayaran Berhasil!\nApakah Anda ingin langsung mengunduh file " + namaApp + "?");
      if (konfirmasi) {
        window.location.href = linkDownload;
      }
    }

    // Jalankan fungsi saat web dibuka
    tampilkanKatalog();
  </script>
</body>
</html>
